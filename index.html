    <script>
      // Applica il tema il prima possibile per evitare flash bianco all'avvio
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : matchMedia("(prefers-color-scheme:dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a1020" : "#0f1f4d");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="w">
      <div class="stk" id="stk">
      <header class="hero">
        <div class="logo" id="logo"></div>
        <div>
          <h1>Matematica Finanziaria</h1>
          <p>
            Ammortamenti · Rendite · Duration · VAN e TIR · Statistica ·
            Obbligazioni · Opzioni
          </p>
        </div>
        <div class="ha">
          <button id="sb" class="hb" aria-label="Cerca">
            ⌕ <span>Cerca opzioni</span> <kbd>Ctrl K</kbd></button
          ><button id="tg" class="hb" aria-label="Cambia tema">◐</button>
        </div>
      </header>
      </div>
      <div class="navw" id="navw">
        <button class="bk" id="bk" aria-label="Torna alla home">
          ← <span>Home</span>
        </button>
        <nav id="nav"></nav>
      </div>
      <p class="hint" id="hn">
        <kbd>/</kbd> o <kbd>Ctrl</kbd>+<kbd>K</kbd> cerca · <kbd>↑</kbd
        ><kbd>↓</kbd> nei campi cambiano il valore · <kbd>Invio</kbd> campo
        successivo · <kbd>Esc</kbd> esci dal campo, poi torna alla home
      </p>
      <section id="hm" aria-label="Home"></section>
      <main id="main">
        <section class="card">
          <h2 id="ft"></h2>
          <div id="form"></div>
        </section>
        <section class="card">
          <h2>Risultati</h2>
          <div id="out"></div>
        </section>
        <section class="card" id="fc">
          <h2>Formule</h2>
          <div id="fm"></div>
        </section>
      </main>
      <div id="pal" hidden>
        <div class="pb">
          <input
            id="pq"
            placeholder="Cerca una sezione o un'opzione… (es. tedesco, anticipata, TIR, durata, tasso)"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="pl" role="listbox"></div>
          <div class="pf">
            <span><kbd>↑</kbd> <kbd>↓</kbd> naviga</span
            ><span><kbd>↵</kbd> apri</span><span><kbd>esc</kbd> chiudi</span>
          </div>
        </div>
      </div>
    </div>
    <!-- ordine di caricamento importante: le variabili sono condivise tra i file -->
